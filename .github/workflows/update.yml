name: update-sub
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          PAID_SUB: ${{ secrets.PAID_SUB }}
        run: |
          curl -fsSL "$PAID_SUB" -o paid.txt
          (base64 -d paid.txt 2>/dev/null || cat paid.txt) > paid_dec.txt
          cat own.txt paid_dec.txt | grep -v '^$' | base64 -w0 > mci
      - name: Commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add mci
          git diff --cached --quiet || (git commit -m update && git push)
