name: update-sub
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          PAID_SUB: ${{ secrets.PAID_SUB }}
          PAID_SUB2: ${{ secrets.PAID_SUB2 }}
        run: |
          curl -fsSL "$PAID_SUB" -o p1.txt
          (base64 -d p1.txt 2>/dev/null || cat p1.txt) > p1d.txt
          curl -fsSL "$PAID_SUB2" -o p2.txt
          (base64 -d p2.txt 2>/dev/null || cat p2.txt) > p2d.txt
          cat own.txt p1d.txt p2d.txt | grep -v '^$' | base64 -w0 > mci
      - name: Commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add mci
          git diff --cached --quiet || (git commit -m update && git push)
